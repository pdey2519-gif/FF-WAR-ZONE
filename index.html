<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FF WAR ZONE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#1c2b2a}
#hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}
.pill{background:#071014c9;border:1px solid #6c8b83;border-radius:12px;padding:8px 12px;font-size:14px}
#health{color:#6dff9b}#controls{position:absolute;inset:auto 0 18px;display:flex;justify-content:space-between;align-items:end;padding:0 22px;pointer-events:none}
#stick{width:132px;height:132px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff77;position:relative;pointer-events:auto;touch-action:none}
#knob{position:absolute;width:54px;height:54px;border-radius:50%;background:#d7eee0aa;border:2px solid #fff;left:37px;top:37px}
#shoot{width:94px;height:94px;border-radius:50%;background:#e64b36dd;border:3px solid #ffd2c9;color:white;font-size:15px;font-weight:900;pointer-events:auto;box-shadow:0 5px 0 #8b2118}
#overlay{position:absolute;inset:0;background:#061014dd;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.panel{max-width:440px;background:#132322;border:1px solid #91b7a3;border-radius:20px;padding:26px;box-shadow:0 15px 60px #0009}
h1{font-size:clamp(30px,8vw,48px);margin:0 0 8px;color:#ffce55;letter-spacing:1px}
button{cursor:pointer}#start{background:#ffce55;border:0;border-radius:12px;padding:14px 28px;font-size:18px;font-weight:900;margin-top:14px;color:#18201b}
small{color:#b9ccc3;line-height:1.5}
</style></head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="pill">❤️ <span id="health">100</span></div><div class="pill">WAVE <span id="wave">1</span></div><div class="pill">☠ <span id="score">0</span></div><div class="pill">🔫 <span id="ammo">∞</span></div></div>
<div id="controls"><div id="stick"><div id="knob"></div></div><button id="shoot">FIRE</button></div>
<div id="overlay"><div class="panel"><h1>FF WAR ZONE</h1><p>Survive the battle. Eliminate every enemy.</p><small>Move with the left joystick. Tap and hold FIRE to shoot toward the nearest enemy. Clear waves to survive.</small><br><button id="start">START BATTLE</button></div></div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W,H,dpr,player,enemies=[],bullets=[],particles=[],running=false,score=0,wave=1,spawned=0,last=0,fire=false,move={x:0,y:0};
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=Math.min(W-30,Math.max(30,player.x));player.y=Math.min(H-30,Math.max(30,player.y));}}
addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H/2,r:15,hp:100,speed:220,cool:0};enemies=[];bullets=[];particles=[];score=0;wave=1;spawned=0;running=true;document.getElementById('overlay').style.display='none';}
function spawn(){let a=Math.random()*Math.PI*2,dist=Math.max(W,H)*.62;let x=player.x+Math.cos(a)*dist,y=player.y+Math.sin(a)*dist;
x=Math.max(18,Math.min(W-18,x));y=Math.max(18,Math.min(H-18,y));enemies.push({x,y,r:14,hp:2+Math.floor(wave/3),speed:48+Math.random()*22+wave*3,hit:0});spawned++;}
function nearest(){let best=null,bd=1e9;for(let e of enemies){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<bd){bd=d;best=e;}}return best;}
function shoot(){let e=nearest();if(!e)return;let dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy)||1;bullets.push({x:player.x,y:player.y,vx:dx/d*520,vy:dy/d*520,life:1.1});}
function burst(x,y,color){for(let i=0;i<7;i++){let a=Math.random()*6.28,s=35+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35,color});}}
function update(dt){
 if(!running)return;
 player.x=Math.max(16,Math.min(W-16,player.x+move.x*player.speed*dt));player.y=Math.max(16,Math.min(H-16,player.y+move.y*player.speed*dt));
 player.cool-=dt;if(fire&&player.cool<=0){shoot();player.cool=.22;}
 if(enemies.length<Math.min(5+wave*2,18)&&spawned<8+wave*3&&Math.random()<dt*.9)spawn();
 for(let e of enemies){let dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;if(d<e.r+player.r){player.hp-=19*dt;}}
 for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp--;b.life=0;burst(b.x,b.y,'#ffd45c');if(e.hp<=0){score+=10;burst(e.x,e.y,'#ff654d');}}}}
 bullets=bullets.filter(b=>b.life>0);enemies=enemies.filter(e=>e.hp>0);
 for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);
 if(spawned>=8+wave*3&&enemies.length===0){wave++;spawned=0;player.hp=Math.min(100,player.hp+15);}
 if(player.hp<=0){player.hp=0;running=false;document.getElementById('overlay').style.display='flex';document.querySelector('.panel').innerHTML=`<h1>GAME OVER</h1><p>Your score: <b>${score}</b></p><p>Wave reached: <b>${wave}</b></p><button id="start">PLAY AGAIN</button>`;document.getElementById('start').onclick=reset;}
 document.getElementById('health').textContent=Math.ceil(player.hp);document.getElementById('wave').textContent=wave;document.getElementById('score').textContent=score;
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#20352f';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;for(let x=0;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=42){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 // scattered cover
 for(let i=0;i<8;i++){let x=(i*173+67)%W,y=(i*239+90)%H;ctx.fillStyle='#40594c';ctx.fillRect(x,y,34,23);ctx.strokeStyle='#829b81';ctx.strokeRect(x,y,34,23);}
 for(let b of bullets){ctx.fillStyle='#ffe27a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();}
 for(let e of enemies){ctx.fillStyle='#b83e35';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#ffd1bd';ctx.fillRect(e.x-5,e.y-3,10,4);ctx.fillStyle='#251b19';ctx.fillRect(e.x-13,e.y-23,26,4);ctx.fillStyle='#ff6655';ctx.fillRect(e.x-13,e.y-23,26*Math.max(0,e.hp)/(2+Math.floor(wave/3)),4);}
 if(player){ctx.fillStyle='#54c7a0';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#e9fff6';ctx.beginPath();ctx.arc(player.x+4,player.y-4,4,0,7);ctx.fill();ctx.strokeStyle='#d8fff1';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+10,player.y-8);ctx.stroke();}
 for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1;}
}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').onclick=reset;
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
function stickMove(e){let r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),d=Math.hypot(x,y),max=42;if(d>max){x=x/d*max;y=y/d*max;}move={x:x/max,y:y/max};knob.style.transform=`translate(${x}px,${y}px)`;}
stick.addEventListener('pointerdown',e=>{sid=e.pointerId;stick.setPointerCapture(sid);stickMove(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)stickMove(e)});function stop(){sid=null;move={x:0,y:0};knob.style.transform='translate(0,0)';}stick.addEventListener('pointerup',stop);stick.addEventListener('pointercancel',stop);
const btn=document.getElementById('shoot');btn.addEventListener('pointerdown',e=>{fire=true;btn.setPointerCapture(e.pointerId)});btn.addEventListener('pointerup',()=>fire=false);btn.addEventListener('pointercancel',()=>fire=false);
})();
</script></body></html>
